<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>)Go To Latihan TKA</title>
  <style>
    body {
      background-color: #ff4d4d; /* Merah */
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    button {
      background-color: #007bff; /* Biru */
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0056b3; /* Biru lebih gelap saat hover */
    }
  </style>
</head>
<body>
  <h1>Website Buatan Hafiz shortcut untuk ke latihan tka</h1>
  <button onclick="window.location.href='https://sd.onedumind.com/'">
    Go To Latihan TKA
  </button>
</body>
</html>
